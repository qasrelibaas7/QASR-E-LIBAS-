<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyra Collective | Luxury Boutique</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>

    <style>
        :root { --gold: #D4AF37; --bg: #f8f9fa; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); overflow-x: hidden; }
        .hero-title { font-family: 'Playfair Display', serif; }
        
        .page-transition { animation: slideUp 0.4s cubic-bezier(0, 0, 0.2, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .hidden-section { display: none !important; }
        .nav-item.active { color: var(--gold); border-top: 2px solid var(--gold); }
        
        /* Sliding Line UI */
        .menu-item { position: relative; overflow: hidden; transition: 0.3s; }
        .menu-item::after { content: ''; position: absolute; bottom: 0; left: 0; width: 0; height: 2px; background: var(--gold); transition: 0.3s; }
        .menu-item:active::after { width: 100%; }

        #sidebar { transition: 0.4s; transform: translateX(-100%); z-index: 5000; }
        #sidebar.active { transform: translateX(0); }
    </style>
</head>
<body class="pb-24">

<div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white shadow-2xl p-6">
    <div class="flex justify-between items-center mb-8 border-b pb-4">
        <h2 class="hero-title text-xl text-gold">Zyra Collective</h2>
        <i onclick="toggleMenu()" class="fas fa-times text-xl"></i>
    </div>
    <div class="space-y-6 text-sm font-bold uppercase tracking-widest text-gray-600">
        <p onclick="location.reload()">Home</p>
        <p onclick="alert('Return Policy: 7 Days Exchange')">Return Policy</p>
        <p onclick="alert('Privacy: Your data is 100% safe')">Privacy Policy</p>
        <p onclick="window.location.href='https://wa.me/917385009275'">Contact Us</p>
    </div>
</div>
<div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/40 z-[4000] hidden-section"></div>

<nav class="bg-white p-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
    <div class="flex items-center space-x-4">
        <i onclick="toggleMenu()" class="fas fa-bars text-xl cursor-pointer"></i>
        <h1 class="text-xl hero-title font-bold">ZYRA</h1>
    </div>
    <div id="auth-ui" onclick="openAccount()">
        <button class="text-[10px] font-bold border-b-2 border-gold uppercase">Login</button>
    </div>
</nav>

<div id="home-view" class="page-transition">
    <section class="h-60 bg-gray-200 relative">
        <img src="images/hero.png" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/800x400?text=Zyra+Boutique'">
        <div class="absolute inset-0 bg-black/20 flex items-center justify-center text-white">
            <h2 class="text-3xl hero-title">Modest Luxury</h2>
        </div>
    </section>

    <div class="p-4 grid grid-cols-2 gap-4">
        <div onclick="openCategory('Burkha')" class="bg-white rounded-2xl shadow-sm border overflow-hidden p-2">
            <img src="images/burkha.png" class="h-40 w-full object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/200x300?text=Burkha'">
            <p class="mt-2 text-center text-[10px] font-bold uppercase">Burkha</p>
        </div>
        <div onclick="openCategory('Abaya')" class="bg-white rounded-2xl shadow-sm border overflow-hidden p-2">
            <img src="images/abaya.png" class="h-40 w-full object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/200x300?text=Abaya'">
            <p class="mt-2 text-center text-[10px] font-bold uppercase">Abaya</p>
        </div>
        <div onclick="openCategory('Hijab')" class="bg-white rounded-2xl shadow-sm border overflow-hidden p-2">
            <img src="images/hijab.png" class="h-40 w-full object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/200x300?text=Hijab'">
            <p class="mt-2 text-center text-[10px] font-bold uppercase">Hijab</p>
        </div>
        <div onclick="openCategory('Kurta')" class="bg-white rounded-2xl shadow-sm border overflow-hidden p-2">
            <img src="images/kurta.png" class="h-40 w-full object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/200x300?text=Kurta'">
            <p class="mt-2 text-center text-[10px] font-bold uppercase">Kurta</p>
        </div>
    </div>
</div>

<div id="product-view" class="hidden-section p-5 page-transition">
    <button onclick="showHome()" class="mb-5 text-gray-400 font-bold text-xs"><i class="fas fa-arrow-left"></i> BACK</button>
    <div id="product-list" class="space-y-6"></div>
</div>

<div id="checkout-view" class="hidden-section fixed inset-0 bg-white z-[1000] p-6 overflow-y-auto">
    <h2 class="hero-title text-2xl mb-6">Checkout</h2>
    <div class="space-y-4">
        <input type="text" id="c-name" placeholder="Full Name" class="w-full border p-4 rounded-xl outline-none">
        <input type="tel" id="c-phone" placeholder="WhatsApp Number" class="w-full border p-4 rounded-xl outline-none">
        <textarea id="c-addr" placeholder="Full Address" class="w-full border p-4 rounded-xl h-24 outline-none"></textarea>
        <select id="c-pay" class="w-full border p-4 rounded-xl font-bold bg-white">
            <option value="COD">Cash on Delivery</option>
            <option value="UPI">Pay Online (15% Discount)</option>
        </select>
        <button onclick="placeOrder()" id="order-btn" class="w-full bg-black text-white py-5 rounded-xl font-bold uppercase tracking-widest">Confirm Order</button>
        <button onclick="closeCheckout()" class="w-full text-gray-400 text-xs mt-2">Cancel</button>
    </div>
</div>

<div id="orders-view" class="hidden-section fixed inset-0 bg-white z-[500] overflow-y-auto page-transition">
    <div class="p-4 border-b flex items-center space-x-4 bg-white sticky top-0">
        <i onclick="showHome()" class="fas fa-arrow-left text-lg"></i>
        <h2 class="font-bold uppercase text-sm tracking-widest">My Orders</h2>
    </div>
    <div id="orders-list" class="p-4 space-y-4">
        </div>
</div>

<div id="profile-view" class="hidden-section fixed inset-0 bg-[#f8f9fa] z-[400] overflow-y-auto page-transition">
    <div class="bg-white p-4 border-b flex items-center space-x-4">
        <i onclick="showHome()" class="fas fa-arrow-left text-lg"></i>
        <h2 class="font-bold text-sm uppercase">Account</h2>
    </div>
    <div class="bg-white p-6 flex items-center space-x-4 border-b mb-2">
        <img id="p-img" src="" class="w-16 h-16 rounded-full border-2 border-gold">
        <div><h3 id="p-name" class="font-bold text-lg">User</h3><p class="text-xs text-gray-400">Zyra Gold Member</p></div>
    </div>
    <div class="bg-white divide-y">
        <div onclick="showOrders()" class="menu-item p-5 flex items-center justify-between"><div class="flex items-center space-x-4"><i class="fas fa-box text-gold"></i><span class="text-sm font-semibold">My Orders</span></div><i class="fas fa-chevron-right text-gray-300"></i></div>
        <div onclick="showSettings()" class="menu-item p-5 flex items-center justify-between"><div class="flex items-center space-x-4"><i class="fas fa-cog text-gray-500"></i><span class="text-sm font-semibold">Settings</span></div><i class="fas fa-chevron-right text-gray-300"></i></div>
        <div onclick="handleLogout()" class="p-5 flex items-center space-x-4 text-red-500 font-bold"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
    </div>
</div>

<div id="settings-view" class="hidden-section fixed inset-0 bg-[#f8f9fa] z-[600] page-transition">
    <div class="bg-white p-4 border-b flex items-center space-x-4">
        <i onclick="openAccount()" class="fas fa-arrow-left text-lg"></i>
        <h2 class="font-bold text-sm uppercase">Settings</h2>
    </div>
    <div class="mt-4 bg-white divide-y">
        <div class="p-4 flex items-center justify-between"><span>WhatsApp Updates</span><input type="checkbox" checked class="accent-gold w-5 h-5"></div>
        <div class="p-4 flex items-center justify-between"><span>Dark Mode (Beta)</span><input type="checkbox" class="accent-gold w-5 h-5"></div>
        <div class="p-4 text-center text-[10px] text-gray-300 tracking-widest uppercase">Version 1.0.1</div>
    </div>
</div>

<div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 flex justify-around items-center z-[1000] shadow-2xl">
    <div onclick="showHome()" id="nav-home" class="nav-item text-center cursor-pointer active"><i class="fas fa-home text-lg"></i><p class="text-[8px] font-bold">HOME</p></div>
    <div onclick="showOrders()" id="nav-orders" class="nav-item text-center cursor-pointer text-gray-300"><i class="fas fa-shopping-bag text-lg"></i><p class="text-[8px] font-bold">ORDERS</p></div>
    <div onclick="openAccount()" id="nav-profile" class="nav-item text-center cursor-pointer text-gray-300"><i class="fas fa-user text-lg"></i><p class="text-[8px] font-bold">PROFILE</p></div>
</div>

<script>
    // Firebase Setup
    const firebaseConfig = {
        apiKey: "AIzaSyAY3G265zTP5Qpf9EoGlGy2sSrVYGI4LGk",
        authDomain: "genzfood2-96e43.firebaseapp.com",
        projectId: "genzfood2-96e43",
        storageBucket: "genzfood2-96e43.firebasestorage.app",
        messagingSenderId: "410241064931",
        appId: "1:410241064931:web:a9dcb7f9401d22b2a30ad6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null;
    let selectedItem = "";
    let itemPrice = 0;

    // View Manager (No Mistakes)
    function hideAll() {
        ['home-view', 'product-view', 'orders-view', 'profile-view', 'settings-view'].forEach(id => document.getElementById(id).classList.add('hidden-section'));
        ['nav-home', 'nav-orders', 'nav-profile'].forEach(id => document.getElementById(id).classList.replace('text-gold', 'text-gray-300'));
        ['nav-home', 'nav-orders', 'nav-profile'].forEach(id => document.getElementById(id).classList.remove('active'));
    }

    function showHome() { hideAll(); document.getElementById('home-view').classList.remove('hidden-section'); document.getElementById('nav-home').classList.add('active'); }
    function showOrders() { 
        if(!currentUser) { handleLogin(); return; }
        hideAll(); 
        document.getElementById('orders-view').classList.remove('hidden-section'); 
        document.getElementById('nav-orders').classList.add('active');
        fetchOrders();
    }
    function openAccount() { if(!currentUser) { handleLogin(); return; } hideAll(); document.getElementById('profile-view').classList.remove('hidden-section'); document.getElementById('nav-profile').classList.add('active'); }
    function showSettings() { hideAll(); document.getElementById('settings-view').classList.remove('hidden-section'); }

    // Auth logic
    auth.onAuthStateChanged(user => {
        if(user) {
            currentUser = user;
            document.getElementById('auth-ui').innerHTML = `<img src="${user.photoURL}" class="w-8 h-8 rounded-full border border-gold">`;
            document.getElementById('p-img').src = user.photoURL;
            document.getElementById('p-name').innerText = user.displayName;
        }
    });
    function handleLogin() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function handleLogout() { auth.signOut().then(() => location.reload()); }
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('overlay').classList.toggle('hidden-section'); }

    // Category & Checkout
    function openCategory(cat) {
        hideAll();
        document.getElementById('product-view').classList.remove('hidden-section');
        let list = document.getElementById('product-list');
        list.innerHTML = '';
        let price = (cat === 'Attar') ? 299 : 899;
        for(let i=1; i<=4; i++) {
            let name = `Zyra ${cat} - Vol ${i}`;
            list.innerHTML += `<div class="bg-white p-4 rounded-2xl border shadow-sm">
                <img src="images/item.png" class="w-full h-80 object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/300?text=${cat}'">
                <div class="mt-4 flex justify-between items-center">
                    <div><h4 class="font-bold text-sm">${name}</h4><p class="text-gold font-bold">₹${price}</p></div>
                    <button onclick="startCheckout('${name}', ${price})" class="bg-black text-white px-6 py-2 rounded-lg text-xs font-bold">BUY</button>
                </div>
            </div>`;
        }
    }
    function startCheckout(name, price) { selectedItem = name; itemPrice = price; document.getElementById('checkout-view').classList.remove('hidden-section'); }
    function closeCheckout() { document.getElementById('checkout-view').classList.add('hidden-section'); }

    async function placeOrder() {
        const name = document.getElementById('c-name').value;
        const phone = document.getElementById('c-phone').value;
        const addr = document.getElementById('c-addr').value;
        const pay = document.getElementById('c-pay').value;

        if(!name || !phone || !addr) return alert("Details bharo bhai!");
        
        const orderData = { Client: name, Item: selectedItem, WhatsApp: phone, Address: addr, Total: "₹" + itemPrice, Timestamp: new Date().toLocaleString() };

        try {
            await db.collection("orders").add(orderData);
            await fetch("https://formspree.io/f/mkovazzj", { method: "POST", body: JSON.stringify(orderData), headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' } });
            alert("Order Success!");
            location.reload();
        } catch (e) { alert("Error!"); }
    }

    async function fetchOrders() {
        const list = document.getElementById('orders-list');
        list.innerHTML = '<p class="text-center text-xs py-10">Loading orders...</p>';
        const snapshot = await db.collection("orders").where("Client", "==", currentUser.displayName).get();
        if(snapshot.empty) { list.innerHTML = '<p class="text-center py-20 text-gray-300">No Orders Found</p>'; return; }
        list.innerHTML = '';
        snapshot.forEach(doc => {
            const data = doc.data();
            list.innerHTML += `<div class="bg-white border rounded-xl p-4 shadow-sm">
                <div class="flex justify-between border-b pb-2 mb-2"><span class="text-[10px] font-bold text-gold">CONFIRMED</span><span class="text-[9px] text-gray-400">${data.Timestamp}</span></div>
                <h4 class="font-bold text-sm">${data.Item}</h4>
                <p class="text-gold font-bold text-sm mt-1">${data.Total}</p>
            </div>`;
        });
    }
</script>
</body>
</html>

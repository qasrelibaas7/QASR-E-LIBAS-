<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyra Collective | Luxury Islamic Boutique</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

    <style>
        :root { --gold: #D4AF37; --dark: #1a1a1a; --yellow: #FFD700; }
        body { font-family: 'Montserrat', sans-serif; background: #fdfaf5; margin: 0; padding-bottom: 100px; }
        .hero-title { font-family: 'Playfair Display', serif; }
        
        #sidebar { transition: 0.4s; transform: translateX(-100%); z-index: 1000; }
        #sidebar.active { transform: translateX(0); }
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 900; }
        #overlay.active { display: block; }

        .hidden-section { display: none !important; }
        .nav-active { color: var(--yellow) !important; }
        details summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body>

<div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white shadow-2xl p-6">
    <h2 class="hero-title text-2xl text-gold mb-10">Zyra Menu</h2>
    <ul class="space-y-6 font-bold uppercase text-xs tracking-widest">
        <li onclick="location.reload()" class="cursor-pointer">Home</li>
        <li onclick="alert('Privacy: Your data is safe.')" class="cursor-pointer">Privacy Policy</li>
        <li onclick="alert('Return: 7 days exchange.')" class="cursor-pointer">Return Policy</li>
    </ul>
    <i onclick="toggleMenu()" class="fas fa-times absolute top-6 right-6 text-xl cursor-pointer"></i>
</div>
<div id="overlay" onclick="toggleMenu()"></div>

<nav class="bg-white p-5 flex justify-between items-center sticky top-0 z-50 shadow-sm">
    <div class="flex items-center space-x-4">
        <i onclick="toggleMenu()" class="fas fa-bars text-xl cursor-pointer"></i>
        <h1 class="text-xl hero-title font-bold">ZYRA COLLECTIVE</h1>
    </div>
    <div id="auth-ui">
        <button onclick="handleLogin()" class="text-[10px] font-bold border-b-2 border-gold uppercase">Login</button>
    </div>
</nav>

<section id="hero-main" class="h-64 bg-gray-200 relative">
    <img src="images/hero.png" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/800x400?text=Zyra+Boutique'">
</section>

<div id="category-view" class="p-5 grid grid-cols-2 gap-4">
    <div onclick="openCategory('Burkha')" class="bg-white rounded-xl shadow-sm border overflow-hidden">
        <img src="images/category1.png" class="h-40 w-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=Burkha'">
        <p class="p-3 text-center text-[10px] font-bold uppercase">Burkha</p>
    </div>
    <div onclick="openCategory('Kurta')" class="bg-white rounded-xl shadow-sm border overflow-hidden">
        <img src="images/category2.png" class="h-40 w-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=Kurta'">
        <p class="p-3 text-center text-[10px] font-bold uppercase">Kurta</p>
    </div>
    <div onclick="openCategory('Hijab')" class="bg-white rounded-xl shadow-sm border overflow-hidden">
        <img src="images/category3.png" class="h-40 w-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=Hijab'">
        <p class="p-3 text-center text-[10px] font-bold uppercase">Hijab</p>
    </div>
    <div onclick="openCategory('Abaya')" class="bg-white rounded-xl shadow-sm border overflow-hidden">
        <img src="images/category4.png" class="h-40 w-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=Abaya'">
        <p class="p-3 text-center text-[10px] font-bold uppercase">Abaya</p>
    </div>
    <div onclick="openCategory('Prayer Mat')" class="bg-white rounded-xl shadow-sm border overflow-hidden">
        <img src="images/category5.png" class="h-40 w-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=Prayer+Mat'">
        <p class="p-3 text-center text-[10px] font-bold uppercase">Prayer Mat</p>
    </div>
    <div onclick="openCategory('Attar')" class="bg-white rounded-xl shadow-sm border overflow-hidden">
        <img src="images/category6.png" class="h-40 w-full object-cover" onerror="this.src='https://via.placeholder.com/200x300?text=Attar'">
        <p class="p-3 text-center text-[10px] font-bold uppercase">Attar</p>
    </div>
</div>

<div id="product-view" class="hidden-section p-5">
    <button onclick="goBack()" class="mb-6 font-bold text-xs uppercase">← Back</button>
    <div id="product-list" class="space-y-6"></div>
</div>

<div id="checkout-page" class="hidden-section fixed inset-0 bg-white z-[1100] p-6 overflow-y-auto">
    <div class="flex justify-between items-center mb-8 border-b pb-4">
        <h2 class="hero-title text-2xl">Checkout</h2>
        <i onclick="closeCheckout()" class="fas fa-times text-xl cursor-pointer"></i>
    </div>
    <div class="space-y-4">
        <input type="text" id="cust-name" placeholder="Full Name" class="w-full border p-4 rounded-xl">
        <input type="tel" id="cust-phone" placeholder="WhatsApp Number" class="w-full border p-4 rounded-xl">
        <textarea id="cust-address" placeholder="Address with Pincode" class="w-full border p-4 rounded-xl h-24"></textarea>
        <select id="pay-method" onchange="toggleQR()" class="w-full border p-4 rounded-xl font-bold">
            <option value="COD">Cash on Delivery (₹499)</option>
            <option value="UPI">UPI Payment (₹424)</option>
        </select>
        <div id="qr-display" class="hidden-section text-center p-4 border-2 border-dashed border-gold rounded-xl">
            <img src="images/paymentqr.png" class="w-48 mx-auto" onerror="this.src='https://via.placeholder.com/200?text=Scan+QR'">
        </div>
        <button onclick="submitOrderProcess()" id="order-btn" class="w-full bg-black text-white py-5 rounded-xl font-bold">PLACE ORDER</button>
    </div>
</div>

<footer class="p-8 border-t bg-white mt-10 text-center">
    <div class="max-w-md mx-auto space-y-4 mb-10 text-left">
        <h3 class="hero-title text-lg text-gold mb-4 text-center">FAQs</h3>
        <details class="border-b pb-2"><summary class="font-bold text-xs cursor-pointer">Delivery Time?</summary><p class="text-[10px] py-2">3-5 working days India-wide.</p></details>
        <details class="border-b pb-2"><summary class="font-bold text-xs cursor-pointer">Return Policy?</summary><p class="text-[10px] py-2">7 days return if product is damaged.</p></details>
    </div>
    <div class="flex justify-center space-x-8 mb-6">
        <a href="https://instagram.com/um3rx70"><i class="fab fa-instagram text-2xl"></i></a>
        <a href="https://wa.me/7385009275"><i class="fab fa-whatsapp text-2xl"></i></a>
    </div>
    <p class="text-[10px] uppercase tracking-widest text-gray-400">© 2026 Zyra Collective</p>
</footer>

<div class="fixed bottom-0 left-0 right-0 bg-black py-4 px-10 flex justify-around items-center z-[1000] border-t border-gray-800">
    <div onclick="location.reload()" class="text-center cursor-pointer">
        <i class="fas fa-home text-lg nav-active"></i>
        <span class="block text-[8px] uppercase mt-1 nav-active font-bold">Home</span>
    </div>
    <div onclick="alert('No orders yet')" class="text-center cursor-pointer opacity-50">
        <i class="fas fa-shopping-bag text-white text-lg"></i>
        <span class="block text-[8px] uppercase mt-1 text-white">Orders</span>
    </div>
    <div onclick="location.reload()" class="text-center cursor-pointer opacity-50">
        <i class="fas fa-sync-alt text-white text-lg"></i>
        <span class="block text-[8px] uppercase mt-1 text-white">Refresh</span>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAY3G265zTP5Qpf9EoGlGy2sSrVYGI4LGk",
        authDomain: "genzfood2-96e43.firebaseapp.com",
        databaseURL: "https://genzfood2-96e43-default-rtdb.firebaseio.com",
        projectId: "genzfood2-96e43",
        storageBucket: "genzfood2-96e43.firebasestorage.app",
        messagingSenderId: "410241064931",
        appId: "1:410241064931:web:a9dcb7f9401d22b2a30ad6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    emailjs.init("CEVDI2dy-A3rfVdZl");

    let currentUser = null;
    let selectedItemName = "";

    // LOGIN PERSISTENCE FIX
    auth.onAuthStateChanged((user) => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-ui').innerHTML = `<img src="${user.photoURL}" class="w-8 h-8 rounded-full border-2 border-gold" onclick="alert('Hello ${user.displayName}')">`;
        } else {
            document.getElementById('auth-ui').innerHTML = `<button onclick="handleLogin()" class="text-[10px] font-bold border-b-2 border-gold uppercase">Login</button>`;
        }
    });

    function handleLogin() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('active');
        document.getElementById('overlay').classList.toggle('active');
    }

    function openCategory(cat) {
        window.scrollTo(0,0);
        document.getElementById('category-view').classList.add('hidden-section');
        document.getElementById('hero-main').classList.add('hidden-section');
        document.getElementById('product-view').classList.remove('hidden-section');
        let list = document.getElementById('product-list');
        list.innerHTML = '';
        let prefix = cat.toLowerCase().replace(/\s+/g, '');
        for(let i=1; i<=7; i++) {
            let itemName = `${cat} Premium ${i}`;
            list.innerHTML += `
                <div class="bg-white p-4 rounded-2xl shadow-sm border">
                    <img src="images/${prefix}${i}.png" class="w-full h-80 object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/300x400?text=Product+Photo'">
                    <div class="mt-4 flex justify-between items-center">
                        <h4 class="font-bold text-sm">${itemName}</h4>
                        <button onclick="startCheckout('${itemName}')" class="bg-black text-white px-4 py-2 rounded text-[10px] font-bold">BUY NOW</button>
                    </div>
                </div>`;
        }
    }

    function goBack() {
        document.getElementById('category-view').classList.remove('hidden-section');
        document.getElementById('hero-main').classList.remove('hidden-section');
        document.getElementById('product-view').classList.add('hidden-section');
    }

    function startCheckout(p) { if(!currentUser) { handleLogin(); return; } selectedItemName = p; document.getElementById('checkout-page').classList.remove('hidden-section'); }
    function closeCheckout() { document.getElementById('checkout-page').classList.add('hidden-section'); }
    function toggleQR() { document.getElementById('qr-display').classList.toggle('hidden-section', document.getElementById('pay-method').value !== 'UPI'); }

    function submitOrderProcess() {
        const name = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const addr = document.getElementById('cust-address').value;
        if(!name || !phone || !addr) { alert("Please fill all details!"); return; }
        
        const btn = document.getElementById('order-btn');
        btn.disabled = true; btn.innerText = "Processing...";

        db.collection("orders").add({
            customer: name, item: selectedItemName, phone: phone, address: addr, time: new Date()
        }).then(() => {
            emailjs.send("service_pmsvfom", "template_vq0n6xs", { customer_name: name, product_name: selectedItemName, phone_number: phone, address: addr })
            .then(() => { alert("Order Success! 🎉"); location.reload(); });
        });
    }
</script>
</body>
</html>

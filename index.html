<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyra Collective | Luxury Boutique</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>

    <style>
        :root { --gold: #D4AF37; --bg: #f8f9fa; --text: #1a1a1a; --card: #ffffff; }
        .dark { --bg: #121212; --text: #f8f9fa; --card: #1e1e1e; }
        
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: var(--text); transition: 0.3s; }
        .hero-title { font-family: 'Playfair Display', serif; }
        .hidden-section { display: none !important; }
        
        /* Page Transition Animation */
        .page-view { animation: slideIn 0.4s ease-out; position: fixed; inset: 0; background: var(--bg); z-index: 100; overflow-y: auto; padding-bottom: 80px; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* Dark Mode Toggle Switch */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--gold); }
        input:checked + .slider:before { transform: translateX(20px); }

        #sidebar { transition: 0.4s; transform: translateX(-100%); z-index: 1000; }
        #sidebar.active { transform: translateX(0); }
    </style>
</head>
<body class="pb-20">

<nav class="bg-white dark:bg-[#1e1e1e] p-4 flex justify-between items-center sticky top-0 z-[50] shadow-sm">
    <div class="flex items-center space-x-4">
        <i onclick="toggleMenu()" class="fas fa-bars text-xl cursor-pointer"></i>
        <h1 class="text-xl hero-title font-bold text-gold">ZYRA</h1>
    </div>
    <div id="auth-ui" onclick="navigateTo('profile-page')">
        <button class="text-[10px] font-bold border-b-2 border-gold uppercase">Login</button>
    </div>
</nav>

<div id="sidebar" class="fixed inset-y-0 left-0 w-72 bg-white dark:bg-[#1e1e1e] shadow-2xl p-6">
    <div class="flex justify-between items-center mb-10 border-b pb-4">
        <h2 class="hero-title text-gold text-xl">Menu</h2>
        <i onclick="toggleMenu()" class="fas fa-times text-xl"></i>
    </div>
    <div class="space-y-6 text-sm font-bold uppercase tracking-widest">
        <p onclick="location.reload()" class="cursor-pointer">Home</p>
        <p onclick="navigateTo('policy-page', 'Return')" class="cursor-pointer">Return Policy</p>
        <p onclick="navigateTo('policy-page', 'Privacy')" class="cursor-pointer">Privacy Policy</p>
        <p onclick="navigateTo('settings-page')" class="cursor-pointer">Settings</p>
    </div>
</div>
<div id="overlay" onclick="toggleMenu()" class="fixed inset-0 bg-black/40 z-[900] hidden-section"></div>

<div id="home-page">
    <section class="h-60 bg-gray-200 relative overflow-hidden">
        <img src="images/hero.png" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/800x400?text=Luxury+Boutique'">
        <div class="absolute inset-0 bg-black/30 flex items-center justify-center"><h2 class="text-3xl text-white hero-title">Modest Luxury</h2></div>
    </section>

    <div class="p-4 grid grid-cols-2 gap-4">
        <div onclick="openCategory('Burkha')" class="bg-white dark:bg-[#1e1e1e] rounded-2xl shadow-sm border dark:border-gray-800 p-2 text-center">
            <img src="images/category1.png" class="h-40 w-full object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/200x300?text=Burkha'">
            <p class="mt-2 text-[10px] font-bold uppercase">Burkha</p>
        </div>
        <div onclick="openCategory('Abaya')" class="bg-white dark:bg-[#1e1e1e] rounded-2xl shadow-sm border dark:border-gray-800 p-2 text-center">
            <img src="images/category4.png" class="h-40 w-full object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/200x300?text=Abaya'">
            <p class="mt-2 text-[10px] font-bold uppercase">Abaya</p>
        </div>
        <div onclick="openCategory('Hijab')" class="bg-white dark:bg-[#1e1e1e] rounded-2xl shadow-sm border dark:border-gray-800 p-2 text-center">
            <img src="images/category3.png" class="h-40 w-full object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/200x300?text=Hijab'">
            <p class="mt-2 text-[10px] font-bold uppercase">Hijab</p>
        </div>
        <div onclick="openCategory('Kurta')" class="bg-white dark:bg-[#1e1e1e] rounded-2xl shadow-sm border dark:border-gray-800 p-2 text-center">
            <img src="images/category2.png" class="h-40 w-full object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/200x300?text=Kurta'">
            <p class="mt-2 text-[10px] font-bold uppercase">Kurta</p>
        </div>
        <div onclick="openCategory('Prayer Mat')" class="bg-white dark:bg-[#1e1e1e] rounded-2xl shadow-sm border dark:border-gray-800 p-2 text-center">
            <img src="images/category5.png" class="h-40 w-full object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/200x300?text=Prayer+Mat'">
            <p class="mt-2 text-[10px] font-bold uppercase">Prayer Mat</p>
        </div>
        <div onclick="openCategory('Attar')" class="bg-white dark:bg-[#1e1e1e] rounded-2xl shadow-sm border dark:border-gray-800 p-2 text-center">
            <img src="images/category6.png" class="h-40 w-full object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/200x300?text=Attar'">
            <p class="mt-2 text-[10px] font-bold uppercase">Attar</p>
        </div>
    </div>
</div>

<div id="page-view" class="page-view hidden-section">
    <div class="p-4 border-b flex items-center space-x-4 bg-white dark:bg-[#1e1e1e] sticky top-0">
        <i onclick="closeView()" class="fas fa-arrow-left text-lg"></i>
        <h2 id="view-title" class="font-bold uppercase text-sm tracking-widest">Page Title</h2>
    </div>
    <div id="view-content" class="p-5">
        </div>
</div>

<div class="fixed bottom-0 left-0 right-0 bg-white dark:bg-[#1e1e1e] border-t dark:border-gray-800 p-3 flex justify-around items-center z-[1000]">
    <div onclick="location.reload()" class="text-center text-gold"><i class="fas fa-home text-lg"></i><p class="text-[8px] font-bold">HOME</p></div>
    <div onclick="navigateTo('orders-page')" class="text-center text-gray-400"><i class="fas fa-shopping-bag text-lg"></i><p class="text-[8px] font-bold">ORDERS</p></div>
    <div onclick="navigateTo('profile-page')" class="text-center text-gray-400"><i class="fas fa-user text-lg"></i><p class="text-[8px] font-bold">PROFILE</p></div>
</div>

<script>
    // Firebase Setup
    const firebaseConfig = {
        apiKey: "AIzaSyAY3G265zTP5Qpf9EoGlGy2sSrVYGI4LGk",
        authDomain: "genzfood2-96e43.firebaseapp.com",
        projectId: "genzfood2-96e43",
        storageBucket: "genzfood2-96e43.firebasestorage.app",
        messagingSenderId: "410241064931",
        appId: "1:410241064931:web:a9dcb7f9401d22b2a30ad6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentUser = null;

    // Dark Mode Logic
    if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

    function toggleDarkMode() {
        document.body.classList.toggle('dark');
        localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
    }

    // View Navigation Logic (The Sliding Line & New Pages)
    function navigateTo(page, subType = '') {
        const view = document.getElementById('page-view');
        const title = document.getElementById('view-title');
        const content = document.getElementById('view-content');
        
        view.classList.remove('hidden-section');
        content.innerHTML = '';

        if (page === 'policy-page') {
            title.innerText = subType + " Policy";
            content.innerHTML = `<div class="bg-white dark:bg-[#1e1e1e] p-6 rounded-2xl shadow-sm border dark:border-gray-800">
                <p class="text-sm leading-relaxed">${subType} policy ki details yahan aayengi. Hamara boutique modest wear ke liye best hai.</p>
            </div>`;
        } else if (page === 'settings-page') {
            title.innerText = "Settings";
            content.innerHTML = `
                <div class="bg-white dark:bg-[#1e1e1e] divide-y dark:divide-gray-800 rounded-2xl overflow-hidden shadow-sm">
                    <div class="p-5 flex justify-between items-center">
                        <div><p class="text-sm font-bold">Dark Mode</p><p class="text-[10px] text-gray-400">Reduce glare</p></div>
                        <label class="switch"><input type="checkbox" onchange="toggleDarkMode()" ${document.body.classList.contains('dark') ? 'checked' : ''}><span class="slider"></span></label>
                    </div>
                    <div class="p-5 flex justify-between items-center">
                        <div><p class="text-sm font-bold">Notifications</p><p class="text-[10px] text-gray-400">Order updates on WhatsApp</p></div>
                        <input type="checkbox" checked class="w-5 h-5 accent-gold">
                    </div>
                    <div class="p-5 text-center text-[10px] text-gray-400 uppercase tracking-widest">Version 1.0.1</div>
                </div>`;
        } else if (page === 'profile-page') {
            if(!currentUser) { handleLogin(); return; }
            title.innerText = "My Account";
            content.innerHTML = `
                <div class="bg-white dark:bg-[#1e1e1e] p-6 flex items-center space-x-4 mb-4 rounded-2xl shadow-sm">
                    <img src="${currentUser.photoURL}" class="w-16 h-16 rounded-full border-2 border-gold">
                    <div><h3 class="font-bold text-lg">${currentUser.displayName}</h3><p class="text-xs text-gray-400">Boutique Member</p></div>
                </div>
                <div class="bg-white dark:bg-[#1e1e1e] divide-y dark:divide-gray-800 rounded-2xl shadow-sm">
                    <div onclick="navigateTo('orders-page')" class="p-5 flex justify-between items-center"><span>My Orders</span><i class="fas fa-chevron-right text-gray-300"></i></div>
                    <div onclick="navigateTo('settings-page')" class="p-5 flex justify-between items-center"><span>Settings</span><i class="fas fa-chevron-right text-gray-300"></i></div>
                    <div onclick="handleLogout()" class="p-5 text-red-500 font-bold">Logout</div>
                </div>`;
        } else if (page === 'orders-page') {
            if(!currentUser) { handleLogin(); return; }
            title.innerText = "Order History";
            fetchOrders(content);
        }
        toggleMenu(false);
    }

    function closeView() { document.getElementById('page-view').classList.add('hidden-section'); }
    function toggleMenu(force) {
        const side = document.getElementById('sidebar');
        const over = document.getElementById('overlay');
        if (force === false) { side.classList.remove('active'); over.classList.add('hidden-section'); return; }
        side.classList.toggle('active');
        over.classList.toggle('hidden-section');
    }

    // Auth & Orders Fetch
    auth.onAuthStateChanged(user => { 
        currentUser = user; 
        if(user) document.getElementById('auth-ui').innerHTML = `<img src="${user.photoURL}" class="w-8 h-8 rounded-full border border-gold">`;
    });
    function handleLogin() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function handleLogout() { auth.signOut().then(() => location.reload()); }

    async function fetchOrders(container) {
        container.innerHTML = '<p class="text-center text-xs py-10">Searching orders...</p>';
        const snap = await db.collection("orders").where("Client", "==", currentUser.displayName).get();
        if(snap.empty) { container.innerHTML = '<p class="text-center py-20 text-gray-400">No orders yet.</p>'; return; }
        container.innerHTML = '';
        snap.forEach(doc => {
            const d = doc.data();
            container.innerHTML += `<div class="bg-white dark:bg-[#1e1e1e] p-4 rounded-xl border dark:border-gray-800 mb-3">
                <p class="text-[10px] text-gold font-bold">ORDERED</p>
                <h4 class="font-bold text-sm">${d.Item || d.Product}</h4>
                <p class="text-gold font-bold text-sm mt-1">${d.Total}</p>
            </div>`;
        });
    }

    // Category
    function openCategory(cat) {
        const view = document.getElementById('page-view');
        const title = document.getElementById('view-title');
        const content = document.getElementById('view-content');
        view.classList.remove('hidden-section');
        title.innerText = cat;
        content.innerHTML = `<div class="grid gap-6">
            <div class="bg-white dark:bg-[#1e1e1e] p-4 rounded-2xl border dark:border-gray-800">
                <img src="images/item.png" class="w-full h-80 object-cover rounded-xl" onerror="this.src='https://via.placeholder.com/400x600?text=${cat}'">
                <div class="mt-4 flex justify-between items-center">
                    <h4 class="font-bold">${cat} Premium</h4>
                    <button class="bg-black text-white px-6 py-2 rounded-lg text-xs font-bold">BUY</button>
                </div>
            </div>
        </div>`;
    }
</script>
</body>
</html>

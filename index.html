<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zyra Collective | Luxury Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>
    <style>
        :root { --gold: #D4AF37; }
        body { font-family: 'Montserrat', sans-serif; background: #fff; color: #1a1a1a; margin: 0; }
        .hero-title { font-family: 'Playfair Display', serif; }
        .hidden { display: none !important; }
        .sidebar { transition: 0.4s; transform: translateX(-100%); z-index: 2000; position: fixed; inset: 0; width: 280px; background: white; border-right: 1px solid #eee; }
        .sidebar.active { transform: translateX(0); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1500; display: none; }
        .overlay.active { display: block; }
    </style>
</head>
<body class="pb-24">

<nav class="bg-white border-b p-4 flex justify-between items-center sticky top-0 z-[1000]">
    <div class="flex items-center space-x-4">
        <i onclick="toggleSidebar(true)" class="fas fa-bars text-xl cursor-pointer"></i>
        <h1 class="text-xl hero-title font-bold text-gold uppercase tracking-tighter">Zyra</h1>
    </div>
    <div id="top-auth" onclick="showSection('profile-page')">
        <button class="text-[10px] font-bold border-b-2 border-gold uppercase">Login</button>
    </div>
</nav>

<div id="sidebar" class="sidebar p-6 shadow-2xl">
    <h2 class="hero-title text-gold text-xl mb-10 border-b pb-4">Zyra Menu</h2>
    <div class="space-y-6 text-xs font-bold uppercase tracking-widest">
        <p onclick="showSection('home-page')" class="cursor-pointer">Home Collection</p>
        <p onclick="showSection('policy-page', 'Return')" class="cursor-pointer">Return Policy</p>
        <p onclick="showSection('policy-page', 'Privacy')" class="cursor-pointer">Privacy Policy</p>
        <div class="pt-10 flex space-x-6 text-xl text-gold">
            <i class="fab fa-instagram"></i><i class="fab fa-whatsapp"></i>
        </div>
    </div>
</div>
<div id="overlay" class="overlay" onclick="toggleSidebar(false)"></div>

<main id="main-content">
    <div id="home-page" class="app-section p-4">
        <div class="relative h-56 bg-gray-100 rounded-[40px] overflow-hidden mb-8 shadow-lg">
            <div id="slider-container" class="flex transition-transform duration-700 ease-in-out h-full" style="width: 300%;">
                <img src="images/hero1.png" class="w-1/3 h-full object-cover" onerror="this.src='https://via.placeholder.com/800x400?text=New+Arrivals'">
                <img src="images/hero2.png" class="w-1/3 h-full object-cover" onerror="this.src='https://via.placeholder.com/800x400?text=Luxury+Collection'">
                <img src="images/hero3.png" class="w-1/3 h-full object-cover" onerror="this.src='https://via.placeholder.com/800x400?text=Eid+Special'">
            </div>
            <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex space-x-2">
                <div class="w-5 h-2 rounded-full bg-white slider-dot transition-all duration-300"></div>
                <div class="w-2 h-2 rounded-full bg-white opacity-50 slider-dot transition-all duration-300"></div>
                <div class="w-2 h-2 rounded-full bg-white opacity-50 slider-dot transition-all duration-300"></div>
            </div>
        </div>

        <div id="category-grid" class="grid grid-cols-2 gap-4"></div>

        <footer class="mt-16 p-10 bg-white border-t text-center space-y-6">
            <h2 class="hero-title text-gold text-2xl uppercase tracking-tighter">Zyra Collective</h2>
            <div class="flex justify-center space-x-8 text-xl text-gray-400">
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-whatsapp"></i></a>
            </div>
            <div class="text-[9px] uppercase tracking-[3px] opacity-40 leading-relaxed">
                <p>Premium Modest Wear Boutique</p>
                <p>© 2026 All Rights Reserved</p>
            </div>
        </footer>
    </div>

    <div id="product-view" class="app-section hidden p-5">
        <div class="flex items-center space-x-4 mb-6" onclick="showSection('home-page')">
            <i class="fas fa-arrow-left"></i> <h2 id="cat-title" class="hero-title text-xl uppercase"></h2>
        </div>
        <div id="prod-list" class="grid gap-8"></div>
    </div>

    <div id="checkout-page" class="app-section hidden p-6">
        <h2 class="hero-title text-2xl mb-6">Order Details</h2>
        <div id="item-summary" class="bg-gray-50 p-6 rounded-3xl mb-6 border border-gold/10"></div>
        <form id="order-form" class="space-y-4">
            <input type="text" id="cust-name" placeholder="Full Name" class="w-full p-4 border rounded-2xl" required>
            <input type="tel" id="cust-phone" placeholder="WhatsApp Number" class="w-full p-4 border rounded-2xl" required>
            <textarea id="cust-address" placeholder="Complete Address with Pincode" class="w-full p-4 border rounded-2xl h-24" required></textarea>
            <div class="p-4 bg-gray-50 rounded-2xl border">
                <p class="text-[10px] font-bold uppercase mb-4 opacity-50">Select Payment Method</p>
                <div class="space-y-3">
                    <label class="flex items-center space-x-3 p-3 bg-white rounded-xl border">
                        <input type="radio" name="pay-method" value="COD" checked onchange="toggleQR(false)">
                        <span class="text-xs font-bold">Cash on Delivery (COD)</span>
                    </label>
                    <label class="flex items-center space-x-3 p-3 bg-white rounded-xl border">
                        <input type="radio" name="pay-method" value="Online" onchange="toggleQR(true)">
                        <span class="text-xs font-bold">Pay via QR / UPI</span>
                    </label>
                </div>
            </div>
            <div id="qr-section" class="hidden text-center p-6 bg-white border-2 border-dashed border-gold rounded-3xl">
                <img src="images/paymentqr.png" class="w-48 mx-auto rounded-lg shadow-md" onerror="this.src='https://via.placeholder.com/200?text=Scan+to+Pay'">
            </div>
            <button type="submit" id="order-btn" class="w-full py-5 bg-black text-white rounded-2xl font-bold uppercase tracking-[3px]">Place Order</button>
        </form>
    </div>

    <div id="policy-page" class="app-section hidden p-5">
        <h2 id="pol-title" class="hero-title text-2xl mb-4 text-gold uppercase"></h2>
        <div id="pol-body" class="bg-gray-50 p-6 rounded-2xl text-sm border opacity-70 leading-relaxed"></div>
        <button onclick="showSection('home-page')" class="w-full mt-6 py-4 bg-black text-white rounded-xl uppercase font-bold">Back to Home</button>
    </div>

    <div id="orders-page" class="app-section hidden p-5">
        <h2 class="hero-title text-2xl mb-6 text-gold uppercase">My Orders History</h2>
        <div id="order-list" class="space-y-4"></div>
    </div>

    <div id="profile-page" class="app-section hidden p-5 text-center">
        <div class="bg-gray-50 p-10 rounded-[40px] border mb-6">
            <img id="u-img" src="" class="w-20 h-20 rounded-full mx-auto border-4 border-white shadow-xl mb-4">
            <h3 id="u-name" class="font-bold text-xl">Guest</h3>
        </div>
        <div onclick="showSection('orders-page')" class="p-5 border rounded-2xl mb-4 flex justify-between cursor-pointer"><span>My Orders</span> <i class="fas fa-chevron-right"></i></div>
        <button onclick="auth.signOut().then(()=>location.reload())" class="text-red-500 font-bold">Sign Out</button>
    </div>
</main>

<div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-around items-center z-[2000]">
    <div onclick="showSection('home-page')" class="text-center cursor-pointer text-gold"><i class="fas fa-home text-xl"></i><p class="text-[8px] font-bold">HOME</p></div>
    <div onclick="showSection('orders-page')" class="text-center cursor-pointer text-gray-400"><i class="fas fa-shopping-bag text-xl"></i><p class="text-[8px] font-bold">ORDERS</p></div>
    <div onclick="showSection('profile-page')" class="text-center cursor-pointer text-gray-400"><i class="fas fa-user-circle text-xl"></i><p class="text-[8px] font-bold">PROFILE</p></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAY3G265zTP5Qpf9EoGlGy2sSrVYGI4LGk",
        authDomain: "genzfood2-96e43.firebaseapp.com",
        projectId: "genzfood2-96e43",
        storageBucket: "genzfood2-96e43.firebasestorage.app",
        messagingSenderId: "410241064931",
        appId: "1:410241064931:web:a9dcb7f9401d22b2a30ad6"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let user = null;
    let currentItem = null;

    const FORMSPREE_ID = "mkovazzj"; 

    const productsData = {
        "Burkha": ["Classic Nida", "Lace Luxe", "Stone Work", "Dubai Style", "Butterfly Cut", "Satin Silk", "Daily Wear"],
        "Abaya": ["A-Line Cut", "Kimono Style", "Open Front", "Zari Abaya", "Premium Velvet", "Summer Breeze", "Luxe Satin"],
        "Hijab": ["Chiffon Soft", "Premium Jersey", "Crinkle Silk", "Satin Pearl", "Instant Hijab", "Viscose Matte", "Modal Hijab"],
        "Kurta": ["Floral Print", "Casual Linen", "Festive Cut", "Embroidered", "Luxe Rayon", "Long Flared", "Party Wear"],
        "Prayer Mat": ["Turkish Padded", "Velvet Mat", "Travel Mat", "Orthopedic", "Kids Mat", "Royal Thread", "Silk Mat"],
        "Attar": ["Oud Al-Layl", "White Musk", "Dehn Oud", "Rose Special", "Arabian Night", "Sweet Amber", "Sandalwood"]
    };

    function initHome() {
        const grid = document.getElementById('category-grid');
        grid.innerHTML = '';
        Object.keys(productsData).forEach((cat, index) => {
            const catImg = `images/category${index + 1}.png`; 
            grid.innerHTML += `
                <div onclick="openCat('${cat}')" class="bg-gray-50 p-2 rounded-3xl border text-center cursor-pointer">
                    <img src="${catImg}" class="h-44 w-full object-cover rounded-2xl" onerror="this.src='https://via.placeholder.com/300?text=${cat}'">
                    <p class="mt-2 text-[10px] font-bold uppercase tracking-widest">${cat}</p>
                </div>`;
        });
    }

    function showSection(id, type) {
        if((id === 'profile-page' || id === 'checkout-page' || id === 'orders-page') && !user) { 
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); return; 
        }
        document.querySelectorAll('.app-section').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');

        if(id === 'policy-page') {
            document.getElementById('pol-title').innerText = type + " Policy";
            document.getElementById('pol-body').innerText = type === 'Return' 
                ? "Return Policy: Aap 7 din ke andar product exchange kar sakte hain." 
                : "Privacy Policy: Aapka data humare paas 100% safe hai.";
        }
        if(id === 'orders-page' && user) fetchOrders();
        toggleSidebar(false);
        window.scrollTo(0,0);
    }

    function toggleSidebar(f) {
        document.getElementById('sidebar').classList.toggle('active', f);
        document.getElementById('overlay').classList.toggle('active', f);
    }

    function toggleQR(show) { document.getElementById('qr-section').classList.toggle('hidden', !show); }

    auth.onAuthStateChanged(u => {
        user = u;
        if(u) {
            document.getElementById('top-auth').innerHTML = `<img src="${u.photoURL}" class="w-8 h-8 rounded-full border border-gold">`;
            document.getElementById('u-img').src = u.photoURL;
            document.getElementById('u-name').innerText = u.displayName;
            document.getElementById('cust-name').value = u.displayName;
        }
    });

    function openCat(name) {
        showSection('product-view');
        document.getElementById('cat-title').innerText = name;
        const list = document.getElementById('prod-list');
        list.innerHTML = '';
        productsData[name].forEach((p, i) => {
            const pImg = `images/${name.toLowerCase()}${i + 1}.png`; 
            list.innerHTML += `
            <div class="bg-white p-4 rounded-3xl border shadow-sm">
                <img src="${pImg}" class="w-full h-80 object-cover rounded-2xl" onerror="this.src='https://via.placeholder.com/400?text=${p}'">
                <div class="mt-4 flex justify-between items-center">
                    <div><h4 class="font-bold text-sm uppercase">${p}</h4><p class="text-gold font-bold">₹1,299</p></div>
                    <button onclick="startCheckout('${p}', '₹1,299')" class="bg-black text-white px-6 py-2 rounded-xl text-[10px] font-bold uppercase">Buy Now</button>
                </div>
            </div>`;
        });
    }

    function startCheckout(name, price) {
        currentItem = { name, price };
        showSection('checkout-page');
        document.getElementById('item-summary').innerHTML = `<h4 class="font-bold text-lg">${name}</h4><p class="text-gold font-bold text-xl">${price}</p>`;
    }

    document.getElementById('order-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('order-btn');
        btn.innerText = "Sending Order...";
        btn.disabled = true;

        const data = {
            Name: document.getElementById('cust-name').value,
            Email: user.email,
            Phone: document.getElementById('cust-phone').value,
            Address: document.getElementById('cust-address').value,
            Payment: document.querySelector('input[name="pay-method"]:checked').value,
            Item: currentItem.name,
            Price: currentItem.price,
            Date: new Date().toLocaleString()
        };

        try {
            await db.collection("orders").add(data);
            await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            alert("✨ Order Received! Hum aapse jald hi WhatsApp par contact karenge.");
            showSection('orders-page');
        } catch (err) { alert("Error: " + err.message); }
        btn.innerText = "Place Order"; btn.disabled = false;
    });

    async function fetchOrders() {
        const list = document.getElementById('order-list');
        list.innerHTML = '<p class="text-center opacity-30">Loading...</p>';
        try {
            const snap = await db.collection("orders").where("Email", "==", user.email).get();
            list.innerHTML = '';
            if(snap.empty) list.innerHTML = '<p class="text-center opacity-30">No orders found.</p>';
            snap.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `<div class="p-4 bg-gray-50 border rounded-2xl mb-3">
                    <p class="text-[9px] text-gold font-bold uppercase">${d.Payment}</p>
                    <h4 class="font-bold">${d.Item}</h4><p class="text-gold font-bold">${d.Price}</p>
                    <p class="text-[8px] opacity-50">${d.Date}</p>
                </div>`;
            });
        } catch(e) { list.innerHTML = "Error loading orders."; }
    }

    // SLIDER LOGIC
    let currentSlide = 0;
    function nextSlide() {
        const slider = document.getElementById('slider-container');
        const dots = document.querySelectorAll('.slider-dot');
        if(!slider || slider.offsetParent === null) return; 

        currentSlide = (currentSlide + 1) % 3;
        slider.style.transform = `translateX(-${(currentSlide * 100) / 3}%)`;
        
        dots.forEach((dot, i) => {
            dot.style.opacity = i === currentSlide ? "1" : "0.5";
            dot.style.width = i === currentSlide ? "20px" : "8px";
        });
    }
    setInterval(nextSlide, 3000); 

    initHome();
</script>

<a href="https://wa.me/917385009275" class="fixed bottom-24 right-6 bg-[#25D366] text-white w-14 h-14 rounded-full flex items-center justify-center shadow-2xl z-[3000] animate-bounce" target="_blank">
    <i class="fab fa-whatsapp text-3xl"></i>
</a>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QASR-E-LIBAS | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        [x-cloak] { display: none !important; }
        .gold-text { color: #D4AF37; }
        .gold-bg { background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); }
        .modal-blur { backdrop-filter: blur(25px); background: rgba(0,0,0,0.9); }
        .dark-input { background: #111 !important; border: 1px solid #333 !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-black text-white" x-data="qasrApp()" x-init="initApp()">

    <header class="sticky top-0 z-50 bg-black/95 border-b border-gold-900/20 py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" @click="page = 'home'">
                <img src="assets/logo.png" @error="$el.src='https://via.placeholder.com/40?text=QL'" class="w-10 h-10 rounded border border-gold-600/30">
                <h1 class="text-xl font-serif font-bold gold-text tracking-widest uppercase">Qasr-E-Libas</h1>
            </div>
            <div class="flex items-center space-x-6">
                <button @click="page = 'home'" :class="page === 'home' ? 'gold-text' : 'text-gray-500'"><i class="fa-solid fa-shop text-xl"></i></button>
                <button @click="openProfile()" :class="page === 'profile' ? 'gold-text' : 'text-gray-500'"><i class="fa-solid fa-user-gear text-xl"></i></button>
            </div>
        </div>
    </header>

    <main x-show="page === 'home'" class="container mx-auto px-4 py-8 space-y-12">
        <template x-for="cat in sections" :key="cat">
            <div>
                <h2 class="text-2xl font-serif gold-text mb-6 border-l-4 border-gold-600 pl-3 uppercase tracking-tighter" x-text="cat"></h2>
                <div class="flex space-x-4 overflow-x-auto pb-4 no-scrollbar snap-x">
                    <template x-for="i in 10" :key="i">
                        <div @click="handleProductSelection(cat, i)" class="snap-start min-w-[220px] md:min-w-[280px] bg-[#0d0d0d] border border-gray-900 rounded-2xl overflow-hidden cursor-pointer hover:border-gold-600 transition duration-500">
                            <img :src="`assets/${cat.toLowerCase().replace(' ', '_')}_${i}.jpg`" 
                                 @error="$el.src='https://via.placeholder.com/400x600?text=Premium+Collection'"
                                 class="h-80 w-full object-cover shadow-inner">
                            <div class="p-5">
                                <h3 class="font-bold text-gray-200" x-text="`Premium ${cat} Edition ${i}`"></h3>
                                <div class="flex justify-between items-center mt-4">
                                    <span class="gold-text font-black text-xl">₹1,250</span>
                                    <span class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">In Stock</span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </main>

    <main x-show="page === 'profile'" x-cloak class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <div class="bg-gray-900/50 p-8 rounded-3xl border border-gold-900/20 text-center mb-8">
                <div class="w-20 h-20 gold-bg rounded-full mx-auto flex items-center justify-center text-3xl text-black font-black mb-4">
                    <span x-text="userPhone.substring(0,1)"></span>
                </div>
                <h2 class="text-xl font-bold uppercase tracking-widest" x-text="userPhone"></h2>
                <p class="text-gray-500 text-xs mt-1 italic">Verified Customer</p>
                <button @click="logout()" class="mt-6 px-6 py-2 border border-red-900/50 text-red-500 text-xs rounded-full hover:bg-red-950 transition">LOGOUT</button>
            </div>

            <h3 class="text-lg font-serif gold-text mb-6 flex items-center space-x-2">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>Order History</span>
            </h3>
            
            <div class="space-y-4">
                <template x-if="orders.length === 0">
                    <div class="text-center py-20 bg-gray-900/20 rounded-3xl border border-dashed border-gray-800">
                        <i class="fa-solid fa-bag-shopping text-4xl text-gray-800 mb-4"></i>
                        <p class="text-gray-600">No orders placed yet.</p>
                    </div>
                </template>
                <template x-for="order in orders" :key="order.id">
                    <div class="bg-[#0f0f0f] border border-gray-800 p-5 rounded-2xl flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-gray-200" x-text="order.product"></h4>
                            <p class="text-[10px] text-gray-500 mt-1" x-text="order.date"></p>
                            <span class="inline-block mt-3 text-[10px] px-3 py-1 rounded-full bg-green-900/20 text-green-500 font-bold uppercase" x-text="order.status"></span>
                        </div>
                        <div class="text-right italic gold-text font-bold" x-text="order.price"></div>
                    </div>
                </template>
            </div>
        </div>
    </main>

    <div x-show="authModal" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center p-4 modal-blur">
        <div class="bg-[#111] max-w-sm w-full rounded-3xl p-8 border border-white/10 text-center relative shadow-2xl">
            <h2 class="text-2xl font-serif gold-text mb-2">Welcome</h2>
            <p class="text-gray-500 text-xs mb-8">Enter your mobile to receive an OTP</p>
            <input type="number" x-model="phoneInput" placeholder="Enter Mobile Number" class="w-full bg-black border border-gray-800 p-4 rounded-xl mb-4 focus:border-gold-600 outline-none text-center text-lg">
            <button @click="login()" class="w-full gold-bg text-black font-black py-4 rounded-xl shadow-lg shadow-gold-900/20">GET OTP & SIGN IN</button>
            <button @click="authModal = false" class="text-gray-600 text-xs mt-6 uppercase tracking-widest">Back to Store</button>
        </div>
    </div>

    <div x-show="checkoutModal" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center p-4 modal-blur">
        <div class="bg-[#111] max-w-lg w-full rounded-3xl overflow-hidden border border-gold-900/20 shadow-2xl">
            <div class="p-6 border-b border-white/5 flex justify-between items-center bg-gray-900/20">
                <h2 class="font-bold gold-text uppercase text-sm tracking-widest">Secure Checkout</h2>
                <button @click="checkoutModal = false" class="text-gray-500"><i class="fa-solid fa-circle-xmark text-xl"></i></button>
            </div>
            
            <div class="p-8 space-y-6 max-h-[80vh] overflow-y-auto">
                <div x-show="checkoutStep === 1" class="space-y-4">
                    <h3 class="text-[10px] text-gray-500 font-bold uppercase">1. Delivery Address</h3>
                    <input type="text" x-model="shipping.name" placeholder="Full Name" class="w-full bg-black border border-gray-800 p-4 rounded-xl focus:border-gold-600 outline-none">
                    <textarea x-model="shipping.address" placeholder="Flat No, Street, Landmark, City & Pincode" class="w-full bg-black border border-gray-800 p-4 rounded-xl h-32 focus:border-gold-600 outline-none"></textarea>
                    <button @click="checkoutStep = 2" class="w-full gold-bg text-black font-black py-4 rounded-xl uppercase tracking-widest">Deliver Here</button>
                </div>

                <div x-show="checkoutStep === 2" class="space-y-4">
                    <h3 class="text-[10px] text-gray-500 font-bold uppercase">2. Select Payment Mode</h3>
                    <div @click="payMethod = 'UPI'" :class="payMethod === 'UPI' ? 'border-gold-600 bg-gold-600/5' : 'border-gray-800'" class="p-5 border rounded-2xl cursor-pointer flex items-center justify-between transition">
                        <div class="flex items-center space-x-4"><i class="fa-solid fa-building-columns gold-text"></i><span>UPI / PhonePe / GPay</span></div>
                        <i :class="payMethod === 'UPI' ? 'fa-solid fa-circle-check gold-text' : 'fa-regular fa-circle text-gray-700'"></i>
                    </div>
                    <div @click="payMethod = 'COD'" :class="payMethod === 'COD' ? 'border-gold-600 bg-gold-600/5' : 'border-gray-800'" class="p-5 border rounded-2xl cursor-pointer flex items-center justify-between transition">
                        <div class="flex items-center space-x-4"><i class="fa-solid fa-truck-ramp-box gold-text"></i><span>Cash on Delivery</span></div>
                        <i :class="payMethod === 'COD' ? 'fa-solid fa-circle-check gold-text' : 'fa-regular fa-circle text-gray-700'"></i>
                    </div>
                    
                    <div class="pt-6 border-t border-gray-800">
                        <div class="flex justify-between font-black text-2xl gold-text uppercase"><span>Total Amount</span><span>₹1,250</span></div>
                        <p class="text-[9px] text-gray-500 mt-2 text-center">Tax and Shipping Included</p>
                    </div>

                    <button @click="finishOrder()" class="w-full gold-bg text-black font-black py-4 rounded-xl uppercase tracking-widest mt-6">Confirm Order</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function qasrApp() {
            return {
                page: 'home',
                authModal: false,
                checkoutModal: false,
                isLoggedIn: false,
                userPhone: '',
                phoneInput: '',
                checkoutStep: 1,
                payMethod: 'UPI',
                selectedItem: null,
                shipping: { name: '', address: '' },
                orders: [],
                sections: ['Kurta', 'Arabic Kurta', 'Burkha', 'Hijab', 'Attar', 'Janamaz', 'Handkerchief'],

                // EMAILJS IDS (Aapko yahan replace karna hai)
                emailConfig: {
                    publicKey: "YOUR_PUBLIC_KEY", // EmailJS Public Key
                    serviceId: "YOUR_SERVICE_ID", // EmailJS Service ID
                    templateId: "YOUR_TEMPLATE_ID" // EmailJS Template ID
                },

                initApp() {
                    emailjs.init(this.emailConfig.publicKey);
                    const savedUser = localStorage.getItem('ql_user');
                    if(savedUser) {
                        this.isLoggedIn = true;
                        this.userPhone = savedUser;
                        this.orders = JSON.parse(localStorage.getItem('ql_orders_' + savedUser) || '[]');
                    }
                },

                openProfile() {
                    if(!this.isLoggedIn) this.authModal = true;
                    else this.page = 'profile';
                },

                login() {
                    if(this.phoneInput.length < 10) return alert("Valid mobile number please.");
                    this.isLoggedIn = true;
                    this.userPhone = this.phoneInput;
                    localStorage.setItem('ql_user', this.phoneInput);
                    this.authModal = false;
                    this.page = 'home';
                },

                handleProductSelection(cat, id) {
                    if(!this.isLoggedIn) { this.authModal = true; return; }
                    this.selectedItem = { name: `Premium ${cat} #${id}` };
                    this.checkoutModal = true;
                    this.checkoutStep = 1;
                },

                finishOrder() {
                    if(!this.shipping.name || !this.shipping.address) return alert("Address please!");
                    
                    const orderId = "QSL-" + Math.floor(Math.random() * 90000 + 10000);
                    const newOrder = {
                        id: orderId,
                        product: this.selectedItem.name,
                        date: new Date().toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}),
                        status: this.payMethod === 'COD' ? 'Order Placed' : 'Awaiting Payment',
                        price: '₹1,250'
                    };

                    // Save to local history
                    this.orders.unshift(newOrder);
                    localStorage.setItem('ql_orders_' + this.userPhone, JSON.stringify(this.orders));

                    // EmailJS Sending Flow
                    const templateParams = {
                        product: this.selectedItem.name,
                        customer_name: this.shipping.name,
                        customer_phone: this.userPhone,
                        address: this.shipping.address,
                        payment: this.payMethod,
                        order_id: orderId
                    };

                    emailjs.send(this.emailConfig.serviceId, this.emailConfig.templateId, templateParams)
                    .then(() => {
                        console.log("Email Receipt Sent Successfully!");
                    });

                    // Payment Flow
                    if(this.payMethod === 'UPI') {
                        window.location.href = `upi://pay?pa=7385009275@fam&pn=QasrELibas&am=1250.00&cu=INR&tn=OrderID_${orderId}`;
                    } else {
                        alert("Order Placed via COD!");
                    }

                    this.checkoutModal = false;
                    this.page = 'profile';
                },

                logout() {
                    localStorage.removeItem('ql_user');
                    location.reload();
                }
            }
        }
    </script>
</body>
</html>

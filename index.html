<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QASR-E-LIBAS | Premium Modest Wear</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        [x-cloak] { display: none !important; }
        :root { --gold: #D4AF37; --dark: #0A0A0A; }
        body { background-color: var(--dark); color: #e5e7eb; font-family: 'Inter', sans-serif; }
        .gold-border { border-color: var(--gold); }
        .gold-text { color: var(--gold); }
        .gold-btn { background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%); color: black; font-weight: 700; }
        .glass-header { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(212, 175, 55, 0.2); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .product-card { background: #141414; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #222; }
        .product-card:hover { border-color: var(--gold); transform: translateY(-8px); box-shadow: 0 10px 30px -10px rgba(212, 175, 55, 0.3); }
        .modal-anim { animation: modalShow 0.4s ease-out; }
        @keyframes modalShow { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body x-data="qasrStore()" x-init="initStore()">

    <header class="sticky top-0 z-[100] glass-header">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-4">
                <img src="assets/logo.png" alt="QL" class="w-10 h-10 object-contain rounded-md border border-gold-900/50">
                <span class="text-2xl font-serif font-bold gold-text tracking-tighter">QASR-E-LIBAS</span>
            </div>
            <button @click="menuOpen = !menuOpen" class="text-2xl gold-text p-2"><i class="fa-solid fa-bars-staggered"></i></button>
        </div>
        
        <nav x-show="menuOpen" x-cloak @click.away="menuOpen = false" class="absolute w-full bg-[#111] border-b border-gold-900/30 p-8 flex flex-col items-center space-y-6 shadow-2xl">
            <a href="#" class="text-xl hover:gold-text">Home</a>
            <a href="#collection" class="text-xl hover:gold-text">Collections</a>
            <a href="https://instagram.com/qasrelibaas7" class="text-xl hover:gold-text">Instagram</a>
            <div class="w-full pt-4 border-t border-gray-800 flex flex-col items-center">
                <template x-if="!isLoggedIn">
                    <button @click="login()" class="gold-btn w-full py-3 rounded-lg">LOGIN TO PLACE ORDER</button>
                </template>
                <template x-if="isLoggedIn">
                    <div class="text-center">
                        <p class="text-green-500 font-bold mb-2">Welcome Back, User!</p>
                        <button @click="logout()" class="text-xs text-gray-500 underline uppercase tracking-widest">Logout</button>
                    </div>
                </template>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-4 py-12 space-y-20" id="collection">
        <template x-for="cat in sections" :key="cat">
            <section>
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-3xl font-serif italic border-l-4 gold-border pl-4" x-text="cat"></h2>
                    <div class="hidden md:flex space-x-2">
                        <div class="w-2 h-2 rounded-full gold-bg"></div>
                        <div class="w-20 h-[1px] bg-gray-700 self-center"></div>
                    </div>
                </div>

                <div class="flex space-x-6 overflow-x-auto no-scrollbar snap-x pb-6">
                    <template x-for="i in 10" :key="i">
                        <div @click="viewProduct(cat, i)" class="snap-start min-w-[220px] md:min-w-[280px] product-card rounded-2xl overflow-hidden cursor-pointer">
                            <div class="h-[320px] relative overflow-hidden">
                                <img :src="`assets/products/${cat.toLowerCase().replace(' ', '_')}_${i}.jpg`" 
                                     @error="$el.src='https://picsum.photos/seed/'+cat+i+'/400/600'"
                                     class="w-full h-full object-cover">
                                <div class="absolute top-3 right-3 bg-black/50 backdrop-blur-md px-2 py-1 rounded text-[10px] gold-text font-bold">PREMIUM</div>
                            </div>
                            <div class="p-5">
                                <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-1" x-text="cat"></p>
                                <h3 class="font-bold text-lg mb-3" x-text="`${cat} Collection - Item ${i}`"></h3>
                                <div class="flex justify-between items-center">
                                    <span class="gold-text font-black text-xl">₹1,250</span>
                                    <div class="flex text-[10px] text-yellow-500"><i class="fa-solid fa-star"></i> 5.0</div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </section>
        </template>
    </main>

    <div x-show="modalOpen" x-cloak class="fixed inset-0 z-[110] flex items-center justify-center p-4 bg-black/95 backdrop-blur-xl">
        <div @click.away="modalOpen = false" class="modal-anim bg-[#111] max-w-5xl w-full rounded-3xl overflow-hidden flex flex-col md:flex-row border border-white/10 shadow-[0_0_50px_rgba(212,175,55,0.1)]">
            <div class="md:w-1/2 h-[400px] md:h-[600px] relative">
                <img :src="selectedItem.img" class="w-full h-full object-cover">
            </div>
            <div class="p-10 md:w-1/2 flex flex-col justify-center">
                <div class="flex justify-between items-start mb-2">
                    <span class="gold-text text-sm font-bold tracking-widest uppercase" x-text="selectedItem.category"></span>
                    <button @click="modalOpen = false" class="text-2xl text-gray-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <h2 class="text-4xl font-serif mb-6" x-text="selectedItem.title"></h2>
                <div class="flex items-center space-x-4 mb-8">
                    <span class="text-3xl font-bold">₹1,250.00</span>
                    <span class="text-gray-500 line-through">₹2,499</span>
                </div>
                
                <div class="space-y-4">
                    <button @click="placeOrder('Order Now')" class="w-full gold-btn py-5 rounded-xl shadow-lg shadow-gold-900/20 hover:scale-[1.02] transition active:scale-95 uppercase tracking-widest">Buy It Now</button>
                    <button @click="placeOrder('Add to Cart')" class="w-full border border-gray-700 py-5 rounded-xl hover:bg-white/5 transition uppercase tracking-widest text-sm font-bold">Add to Cart</button>
                </div>

                <div class="mt-8 pt-8 border-t border-gray-800 flex items-center justify-between text-xs text-gray-500 uppercase tracking-widest">
                    <span>Secure Checkout</span>
                    <span>Free Shipping on ₹2000+</span>
                </div>
            </div>
        </div>
    </div>

    <div class="fixed bottom-6 right-6 flex flex-col space-y-4 z-50">
        <a href="https://instagram.com/qasrelibaas7" class="w-12 h-12 bg-[#222] border border-gray-700 rounded-full flex items-center justify-center text-xl hover:gold-text transition"><i class="fa-brands fa-instagram"></i></a>
        <a href="https://wa.me/917385009275" class="w-14 h-14 bg-green-600 rounded-full flex items-center justify-center text-white text-3xl shadow-2xl hover:scale-110 transition"><i class="fa-brands fa-whatsapp"></i></a>
    </div>

    <script>
        function qasrStore() {
            return {
                menuOpen: false,
                modalOpen: false,
                isLoggedIn: localStorage.getItem('ql_auth') === 'true',
                sections: ['Kurta', 'Arabic Kurta', 'Burkha', 'Hijab', 'Dupatta', 'Topi', 'Attar', 'Janamaz', 'Handkerchief'],
                selectedItem: {},

                initStore() {
                    // Initialize EmailJS with your Public Key
                    emailjs.init("YOUR_PUBLIC_KEY"); 
                },

                login() {
                    this.isLoggedIn = true;
                    localStorage.setItem('ql_auth', 'true');
                    this.menuOpen = false;
                    alert("Logged in successfully! You can now place orders.");
                },

                logout() {
                    this.isLoggedIn = false;
                    localStorage.setItem('ql_auth', 'false');
                },

                viewProduct(cat, id) {
                    this.selectedItem = {
                        category: cat,
                        title: `${cat} Premium Series`,
                        img: `assets/products/${cat.toLowerCase().replace(' ', '_')}_${id}.jpg`
                    };
                    // Fallback for demo
                    if (this.selectedItem.img.includes('undefined')) this.selectedItem.img = `https://picsum.photos/seed/${cat+id}/800/1200`;
                    this.modalOpen = true;
                },

                placeOrder(type) {
                    if (!this.isLoggedIn) {
                        alert("Access Restricted: Please login to your account first.");
                        this.menuOpen = true;
                        this.modalOpen = false;
                        return;
                    }

                    // Prepare Email Data
                    const templateParams = {
                        to_name: "Admin",
                        from_name: "QASR-E-LIBAS Store",
                        message: `New ${type}: ${this.selectedItem.title}`,
                        customer_email: "umertakildar7@gmail.com",
                        order_details: `Category: ${this.selectedItem.category} | Amount: ₹1,250`
                    };

                    emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", templateParams)
                        .then(() => console.log("Receipt sent!"))
                        .catch(err => console.error("Email error", err));

                    alert(`Order Processed!\nType: ${type}\nProduct: ${this.selectedItem.title}\n\nReceipt sent to umertakildar7@gmail.com`);
                    this.modalOpen = false;
                }
            }
        }
    </script>
</body>
</html>
